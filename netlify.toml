[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Prisma 4 generates engines into .prisma/client; scripts/bundle-prisma-engines.mjs
# (run in build:netlify) also copies the rhel engines into @prisma/client/runtime,
# which is where the Lambda's Prisma Client searches first. Bundle both locations.
[functions."___netlify-server-handler"]
  # Local builds retain macOS Sharp/Prisma for compilation; Lambda uses Linux.
  excluded_files = [
    "**/node_modules/@img/sharp-darwin-*/**",
    "**/node_modules/@img/sharp-libvips-darwin-*/**",
    "**/node_modules/@img/sharp-wasm32/**",
    "**/node_modules/.prisma/client/*darwin*",
  ]
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/client/runtime/libquery_engine-rhel-openssl-1.0.x.so.node",
    "node_modules/@prisma/client/runtime/libquery_engine-rhel-openssl-3.0.x.so.node",
    "node_modules/@img/sharp-linux-x64/**",
    "node_modules/@img/sharp-libvips-linux-x64/**",
  ]
