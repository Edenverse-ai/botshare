services:
  registry-db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:55439:5432"
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry_local_only
      POSTGRES_DB: botshare_registry_dev
    volumes:
      - registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d botshare_registry_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  registry-data:
